name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      MSSQL_SA_PASSWORD: TestSAPassword!
      DB_USER: TestUser
      DB_PASSWORD: TestUserPassword!
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=MedicalRegister;User Id=TestUser;Password=TestUserPassword!;TrustServerCertificate=True;"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Start SQL Server
        run: docker compose up -d --wait sql-server

      - name: Initialize database
        run: docker compose run --rm database-init

      - name: Run tests
        run: dotnet test Register/Register.slnx --nologo --configuration Release

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs sql-server

      - name: Stop SQL Server
        if: always()
        run: docker compose down -v