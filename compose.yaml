
name: medical-register

services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: medical-register-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database:/scripts:ro
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -l 2 -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 45s

  database-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    depends_on:
      sql-server:
        condition: service_healthy
    restart: "no"
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - "-S"
      - "tcp:sql-server,1433"
      - "-U"
      - "sa"
      - "-P"
      - "${MSSQL_SA_PASSWORD}"
      - "-C"
      - "-b"
      - "-l"
      - "30"
      - "-v"
      - "DB_USER=${DB_USER}"
      - "DB_PASSWORD=${DB_PASSWORD}"
      - "-i"
      - "/scripts/init.sql"

volumes:
  sqlserver_data:
